# QA-01 (D-039): CI runs every check of the README section "Tests and lint" on Linux with Playwright's Chromium and a
# fake camera. Models (.task) are downloaded per public/models/models.json and cached by the manifest's sha256; wasm is
# copied from node_modules. E2E cases that need local assets (face.png, hands.jpg, not committed) skip themselves.
# REL-01 (D-048, D-050): the check job builds with VITE_BASE (repository variable PAGES_BASE, default /<repo>/ for
# https://<user>.github.io/<repo>/), verifies the production build with `test:deploy` (service worker, base path, I9) and
# uploads dist/ as the Pages artifact; the deploy job publishes it to GitHub Pages only on push to main (Settings → Pages →
# Source: GitHub Actions). Rollback: re-run the deploy job of an older commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'PERF-01 soak (minutes); the soak job only runs when triggered manually'
        default: '15'
      bench_seconds:
        description: 'QA-02 benchmark (seconds per measurement); the bench job only runs when triggered manually'
        default: '20'

concurrency:
  group: ci-${{ github.ref }}
  # Pull request: a new push cancels the previous run. main: never cancel, so the deploy job is not cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      # REL-01 (D-050): base path of the page for build and test:deploy only (not for the whole job: the e2e dev server
      # must stay at '/' as documented). Without a custom domain: /<repo>/; with one: set repository variable PAGES_BASE = /.
      PAGES_BASE: ${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache MediaPipe models
        uses: actions/cache@v6
        with:
          path: public/models/*.task
          key: models-${{ hashFiles('public/models/models.json') }}

      - run: npm run models:fetch

      - run: npm run lint
      - run: npm run lint:boundaries
      - run: npm run check:invariants
      - run: npx prettier --check .

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Check Mermaid diagrams
        run: |
          node tools/check-mermaid.mjs docs/WORK-BREAKDOWN.md
          node tools/check-mermaid.mjs docs/Plan-Web-Camera-Tracking.md

      - name: Unit (Vitest)
        run: npx vitest run --reporter=default --reporter=json --outputFile=reports/unit.json

      - name: Dataset tools and classifier metrics (CLS-01, CLS-02; Python unittest, standard library)
        run: |
          python3 -m unittest discover -s tools/dataset -p "test_*.py"
          python3 -m unittest discover -s tools/train -p "test_*.py"

      - name: E2E (Playwright, fake camera)
        run: npm run test:e2e

      - run: npm run build
        env:
          VITE_BASE: ${{ env.PAGES_BASE }}

      - name: Check clean build (REL-01, section 7.27)
        env:
          VITE_BASE: ${{ env.PAGES_BASE }}
        run: |
          test ! -e dist/spike-assets
          test -f dist/sw.js
          ! grep -q __WCT_ dist/sw.js
          echo "dist/: $(du -sh dist | cut -f1); largest file: $(find dist -type f -printf '%s %p\n' | sort -n | tail -1)"
          echo "VITE_BASE=$VITE_BASE; index.html: $(grep -o 'src="[^"]*"' dist/index.html)"

      - name: E2E on the production build (service worker, base path, I9; REL-01)
        env:
          VITE_BASE: ${{ env.PAGES_BASE }}
        run: npm run test:deploy

      - name: Generate the mask report from JSON
        if: always()
        run: node tools/test-report.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            reports/
            test-results/
            docs/test-report-mask.md
          if-no-files-found: ignore

      - name: Upload dist (preview for pull requests)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload dist as the GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # REL-01 (D-048, D-050): publish the Pages artifact of the check job to GitHub Pages. Push to main only; pull requests
  # and workflow_dispatch do not deploy. The URL is printed in the summary and on the github-pages environment.
  # Rollback: re-run this job on the run of an older commit.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
      - run: |
          echo "Deployed: ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the app directly: ${{ steps.deploy.outputs.page_url }}#/app" >> "$GITHUB_STEP_SUMMARY"

  # PERF-01: the long soak runs separately when triggered manually (workflow_dispatch), not inside the check job.
  soak:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      SOAK_MINUTES: ${{ inputs.soak_minutes || '15' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache MediaPipe models
        uses: actions/cache@v6
        with:
          path: public/models/*.task
          key: models-${{ hashFiles('public/models/models.json') }}
      - run: npm run models:fetch
      - run: npx playwright install --with-deps chromium
      - name: Soak (Playwright, fake camera)
        run: npm run test:soak
      - name: Generate the benchmark from soak samples
        if: always()
        run: node tools/benchmark-report.mjs
      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak
          path: |
            reports/
            docs/benchmark.md
          if-no-files-found: ignore

  # QA-02: device-matrix benchmark on the runner (Chromium headless shell, no GPU: a lower bound only) when triggered
  # manually; measurements on the target machine with a GPU come from `npm run test:bench` locally, then commit
  # docs/benchmark-matrix.json.
  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      BENCH_SECONDS: ${{ inputs.bench_seconds || '20' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache MediaPipe models
        uses: actions/cache@v6
        with:
          path: public/models/*.task
          key: models-${{ hashFiles('public/models/models.json') }}
      - run: npm run models:fetch
      - run: npx playwright install --with-deps chromium
      - name: Benchmark (Playwright, synthetic source)
        run: npm run test:bench
      - name: Merge the device matrix
        if: always()
        run: node tools/benchmark-report.mjs
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench
          path: |
            reports/
            docs/benchmark.md
            docs/benchmark-matrix.json
          if-no-files-found: ignore
